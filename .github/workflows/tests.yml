name: Backend tests
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  common-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ai_judge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_judge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AI_JUDGE_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/ai_judge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check ai_judge migrations tests
      - run: ruff format --check ai_judge migrations tests
      - run: python -m pytest -q
