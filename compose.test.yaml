# Disposable C-1 integration database only. No production volumes or credentials.
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_judge_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_judge_test"]
      interval: 2s
      timeout: 3s
      retries: 30
